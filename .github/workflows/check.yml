name: Run checks

on:
  workflow_call:
    inputs:
      cache-write:
        description: "Whether this run may populate the shared caches. Trusted callers only."
        type: boolean
        default: false

jobs:

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pylint
        run: uv run pylint daenes

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pyright
        run: uv run pyright daenes

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  # Loads the zones daenes writes with BIND's own checker, which is the only
  # thing here that can say a zone file is one a DNS server would accept.
  zone-validity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the zone checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bind9-utils
      # The suite skips itself when the checker is missing, which would leave
      # this job green having proved nothing. Fail here instead.
      - name: Check that the zone checker is installed
        run: command -v named-checkzone
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the zone validity tests
        # The coverage flags in pyproject.toml target the unit tests, and
        # nothing here is about covering daenes.main.
        run: uv run pytest daenes/tests/zone_validity -o addopts=""

  # What daenes assumes about the docker API, checked against the daemon on the
  # runner. Nothing here runs daenes, so no image is built.
  docker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Some of these need one. A daemon that cannot make one would skip them
      # and leave the job green having proved nothing about IPv6.
      - name: Check that the daemon can create an IPv6 network
        run: |
          docker network create --ipv6 ipv6-probe
          docker network rm ipv6-probe
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the contract tests
        run: uv run pytest daenes/tests/end_to_end -o addopts="" -m contract

  # The real image, built from the Dockerfile, reading a real daemon and
  # writing real zone files. No secret is involved, so this runs on every pull
  # request, forks included.
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the daemon can create an IPv6 network
        run: |
          docker network create --ipv6 ipv6-probe
          docker network rm ipv6-probe
      # One test hands the zone daenes wrote to a real DNS server's checker.
      - name: Install the zone checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bind9-utils
      - name: Check that the zone checker is installed
        run: command -v named-checkzone
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The tests shell out to `docker buildx build` themselves, so the cache
      # credentials docker/build-push-action would have injected on its own
      # have to be exported into the environment by hand.
      - name: Expose GitHub Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the end-to-end tests
        run: uv run pytest daenes/tests/end_to_end -o addopts="" -m "not contract" -n 4
        env:
          E2E_CACHE_WRITE: ${{ inputs.cache-write }}
