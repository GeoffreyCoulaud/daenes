name: Run checks

on:
  workflow_call:
    inputs:
      cache-write:
        description: "Whether this run may populate the shared caches. Trusted callers only."
        type: boolean
        default: false

jobs:

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pylint
        run: uv run pylint daenes

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pyright
        run: uv run pyright daenes

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  # Loads the zones daenes writes with BIND's own checker, which is the only
  # thing here that can say a zone file is one a DNS server would accept.
  zone-validity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the zone checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bind9-utils
      # The suite skips itself when the checker is missing, which would leave
      # this job green having proved nothing. Fail here instead.
      - name: Check that the zone checker is installed
        run: command -v named-checkzone
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          save-cache: ${{ inputs.cache-write }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the zone validity tests
        # The coverage flags in pyproject.toml target the unit tests, and
        # nothing here is about covering daenes.main.
        run: uv run pytest daenes/tests/zone_validity -o addopts=""

  # There are no end-to-end tests, so building the image is what keeps the
  # Dockerfile from breaking unnoticed between two releases.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: ${{ inputs.cache-write && 'type=gha,mode=max,ignore-error=true' || '' }}
