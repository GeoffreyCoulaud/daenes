[project]
name = "daenes"
version = "1.0.0"
description = "Local DNS zones from docker labels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
]

[project.scripts]
daenes = "daenes.main.main:main"

# Dev tools (tests + linters). The `dev` group is installed by default by
# `uv sync`, so it is excluded from the Docker image via `--no-dev`.
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "pylint>=4",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["daenes/tests/unit"]
addopts = "--cov=daenes.main --cov-branch --cov-report=term-missing --cov-fail-under=100"

# Keep the tests subpackage out of built wheels/sdists.
[tool.hatch.build]
exclude = ["daenes/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
